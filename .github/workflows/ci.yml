name: KnowFlow AI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# CI 只需要读取代码，不授予写仓库或访问其他资源的权限。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci_knowflow.db
      UPLOAD_DIR: ./ci_uploads
      CHROMA_PERSIST_DIR: ./ci_chroma_db

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v7

      - name: 配置 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 运行后端测试
        run: python -m pytest

  frontend-check:
    name: 前端检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v7

      - name: 配置 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: 安装前端依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 检查 Python 语法
        run: python -m compileall -q .
